---
# ==============================================================================
# Common 角色任务：基础环境加固与网络配置 (PDF 第二节)
# ==============================================================================

- name: 停止并禁用防火墙 (firewalld)
  service:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: 清理 iptables 规则 (iptables -F)
  command: iptables -F
  changed_when: false
  ignore_errors: true

- name: 临时关闭 SELinux
  command: setenforce 0
  ignore_errors: true
  changed_when: false

- name: 永久禁用 SELinux
  selinux:
    state: disabled
  ignore_errors: true

- name: 备选方案：通过 sed 禁用 SELinux 配置文件
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'
  ignore_errors: true

- name: 设置本机主机名
  hostname:
    name: "{{ inventory_hostname }}"

- name: 批量配置 /etc/hosts 集群解析 (PDF 第 4 页)
  lineinfile:
    path: /etc/hosts
    regexp: ".*\\s+{{ hostvars[item]['ansible_host'] | default(item) }}\\s+{{ item }}$"
    line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
    state: present
  loop: "{{ groups['all_nodes'] }}"

- name: 创建软件基础目录 /home/software
  file:
    path: "{{ software_base_dir }}"
    state: directory
    owner: "{{ bigdata_user }}"
    group: "{{ bigdata_group }}"
    mode: '0755'

- name: 配置 root 用户 SSH 客户端默认免交互 (StrictHostKeyChecking=no)
  blockinfile:
    path: /root/.ssh/config
    create: true
    mode: '0600'
    block: |
      Host *
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          LogLevel ERROR

# ----------------- 生产级系统底层与内核深度调优 -----------------

- name: 启动并启用 Chrony 时钟同步服务 (保障 ZK 及 HDFS HA 绝对时钟对齐)
  service:
    name: chronyd
    state: started
    enabled: true
  ignore_errors: true

- name: 生产级内核参数调优 (关闭虚存换页，提高套接字并发与文件上限)
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-bigdata.conf
    reload: true
  loop:
    - { key: 'vm.swappiness', value: '1' }
    - { key: 'net.core.somaxconn', value: '32768' }
    - { key: 'net.ipv4.tcp_max_syn_backlog', value: '16384' }
    - { key: 'fs.file-max', value: '6553600' }
  ignore_errors: true

- name: 调优最大文件打开数与最大进程数 limits.conf
  blockinfile:
    path: /etc/security/limits.d/99-bigdata.conf
    create: true
    mode: '0644'
    block: |
      * soft nofile 655360
      * hard nofile 655360
      * soft nproc 655360
      * hard nproc 655360
      * soft memlock unlimited
      * hard memlock unlimited

- name: 禁用透明大页 (THP)，防止大数据高吞吐场景出现内存碎片停顿
  shell: |
    echo never > /sys/kernel/mm/transparent_hugepage/enabled || true
    echo never > /sys/kernel/mm/transparent_hugepage/defrag || true
  changed_when: false
  ignore_errors: true

- name: 持久化禁用透明大页到 /etc/rc.local
  lineinfile:
    path: /etc/rc.d/rc.local
    line: "echo never > /sys/kernel/mm/transparent_hugepage/enabled; echo never > /sys/kernel/mm/transparent_hugepage/defrag"
    state: present
  ignore_errors: true

- name: 确保 /etc/rc.d/rc.local 具备执行权限
  file:
    path: /etc/rc.d/rc.local
    mode: '+x'
  ignore_errors: true

- name: 配置大数据组件日志自动切割轮转规则 (防止磁盘打满宕机)
  copy:
    dest: /etc/logrotate.d/bigdata
    mode: '0644'
    content: |
      /home/software/*/logs/*.log /usr/local/*/logs/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }

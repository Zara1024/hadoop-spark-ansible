---
# ==============================================================================
# Hadoop + Spark + ZooKeeper 集群主机清单 (inventory/hosts.yml)
# 采用标准 YAML 格式定义 (依据 05 hadoop+spark+zookeeper.pdf 1.2 主机规划)
# ==============================================================================

all:
  children:
    # ----------------- 1. 集群全节点列表 (私网 VPC IP 与节点变量) -----------------
    all_nodes:
      hosts:
        spark01:
          ansible_host: 192.168.71.111
          myid: 1
          nn_id: nn1
          rm_id: rm1
        spark02:
          ansible_host: 192.168.71.112
          myid: 2
          nn_id: nn2
        spark03:
          ansible_host: 192.168.71.113
          myid: 3
          rm_id: rm2
        spark04:
          ansible_host: 192.168.71.114
        spark05:
          ansible_host: 192.168.71.115
        spark06:
          ansible_host: 192.168.71.116

    # ----------------- 2. 组件业务角色分组 -----------------

    # ZooKeeper 分布式集群 (3 节点仲裁)
    zookeepers:
      hosts:
        spark01:
        spark02:
        spark03:

    # HDFS NameNode Active 主节点 (1 节点)
    namenode_active:
      hosts:
        spark01:

    # HDFS NameNode Standby 备用节点 (1 节点)
    namenode_standby:
      hosts:
        spark02:

    # NameNode 全体节点集合
    namenodes:
      children:
        namenode_active:
        namenode_standby:

    # ZKFailoverController 自动故障切换感知器
    zkfc:
      children:
        namenodes:

    # JournalNode 集群 (3 节点，用于元数据 edits 共享同步)
    journalnodes:
      hosts:
        spark04:
        spark05:
        spark06:

    # HDFS DataNode 数据节点 (数据块三副本存储)
    datanodes:
      hosts:
        spark04:
        spark05:
        spark06:

    # YARN ResourceManager Active 主节点
    rm_active:
      hosts:
        spark01:

    # YARN ResourceManager Standby 备节点
    rm_standby:
      hosts:
        spark03:

    # ResourceManager 全体集合
    resourcemanagers:
      children:
        rm_active:
        rm_standby:

    # YARN NodeManager 计算工作节点
    nodemanagers:
      hosts:
        spark04:
        spark05:
        spark06:

    # 从节点汇总 (写入 slaves 文件，对应 DataNode 与 NodeManager)
    slaves:
      children:
        datanodes:
        nodemanagers:

    # Spark 客户端节点 (PDF 第四节要求安装在 spark04、spark05、spark06)
    spark_clients:
      hosts:
        spark04:
        spark05:
        spark06:

    # Spark History Server 节点 (PDF 第八节要求部署于 spark06，端口 18080)
    spark_history_server:
      hosts:
        spark06:

    # GPU 计算主机 (PDF 第九节注意点：计算节点部署于 GPU 主机)
    gpu_nodes:
      hosts:
        spark04:
        spark05:
        spark06:

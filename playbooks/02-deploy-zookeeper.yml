---
# ==============================================================================
# Playbook 02: 离线部署 ZooKeeper 3.8.4 高可用协调集群 (PDF 第 7~10 页)
# ==============================================================================

- name: 在 spark01, spark02, spark03 上部署并启动 ZooKeeper 集群
  hosts: zookeepers
  gather_facts: false
  roles:
    - zookeeper

- name: 验证 ZooKeeper 状态与 Leader/Follower 角色选举 (PDF 第 9 页)
  hosts: zookeepers
  gather_facts: false
  tasks:
    - name: 查询 zkServer.sh 运行状态
      shell: |
        source /etc/profile
        {{ zookeeper_install_dir }}/bin/zkServer.sh status
      register: zk_status_output
      changed_when: false
      retries: 3
      delay: 5

    - name: 输出各节点 ZooKeeper 状态与角色
      debug:
        msg: "{{ inventory_hostname }} 状态: {{ zk_status_output.stdout_lines | default(zk_status_output.stderr_lines) }}"

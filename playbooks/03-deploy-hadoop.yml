---
# ==============================================================================
# Playbook 03: 离线部署 Hadoop 2.10.1 HA 高可用集群 (PDF 第三节)
# 包含 HDFS HA (QJM + ZKFC) 与 YARN HA (ZKRMStateStore)
# ==============================================================================

- name: 在集群全体节点分发 Hadoop 2.10.1 并下发核心 XML 配置
  hosts: all_nodes
  gather_facts: false
  roles:
    - hadoop

- name: 执行 Hadoop HA 集群初始化状态机 (严格按时序格式化与启动)
  hosts: all_nodes
  gather_facts: false
  tasks:
    - name: 导入 HA 初始化编排任务
      import_tasks: ../roles/hadoop/tasks/init_ha.yml

- name: 检查 NameNode HA 角色与状态 (PDF 第 26 页)
  hosts: namenodes
  gather_facts: false
  tasks:
    - name: 查询 NameNode 状态 (Active / Standby)
      shell: |
        source /etc/profile
        {{ hadoop_install_dir }}/bin/hdfs haadmin -getServiceState {{ nn_id }}
      register: nn_state
      changed_when: false

    - name: 打印 NameNode 状态
      debug:
        msg: "{{ inventory_hostname }} ({{ nn_id }}) 当前状态为: {{ nn_state.stdout }}"

- name: 检查 YARN ResourceManager HA 状态 (PDF 第 27 页)
  hosts: resourcemanagers
  gather_facts: false
  tasks:
    - name: 查询 ResourceManager 状态 (Active / Standby)
      shell: |
        source /etc/profile
        {{ hadoop_install_dir }}/bin/yarn rmadmin -getServiceState {{ rm_id }}
      register: rm_state
      changed_when: false

    - name: 打印 ResourceManager 状态
      debug:
        msg: "{{ inventory_hostname }} ({{ rm_id }}) 当前状态为: {{ rm_state.stdout }}"
